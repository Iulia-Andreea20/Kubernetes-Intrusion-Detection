apiVersion: v1
kind: ConfigMap
metadata:
  name: ids-config
  namespace: ids-system
data:
  threshold: "0.5"
  model_name: "distilbert-base-uncased"
  max_length: "512"
  batch_size: "16"
  log_level: "INFO"
  # Data collection settings
  collect_network_flows: "true"
  collect_api_audits: "true"
  collect_pod_logs: "true"
  # Alert settings
  alert_webhook_url: ""
  alert_cooldown_seconds: "60"
