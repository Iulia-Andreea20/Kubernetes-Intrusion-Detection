# Development fallback for when there is no registry: same hardened pod spec as 11-audit-xgb.yaml,
# but the code and model come from a ConfigMap instead of a baked image. The only difference is
# mutability - deliberately, so the two paths cannot drift apart on security settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-audit-xgb
  namespace: runtime-ids
  labels: { app: ids-audit-xgb, component: audit, version: "1.9-hybrid" }
spec:
  replicas: 2                       # HA (era 1)
  selector:
    matchLabels: { app: ids-audit-xgb }
  template:
    metadata:
      labels: { app: ids-audit-xgb, component: audit, version: "1.9-hybrid" }
    spec:
      affinity:                     # HA REAL: identic cu canonicul (poduri pe noduri diferite)
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: ids-audit-xgb }
                topologyKey: kubernetes.io/hostname
      securityContext:              # pod-level: ruleaza ne-root
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit-xgb
          image: andreeagrigore/runtime-ids:1.1
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/xgb/audit_xgb_service.py"]
          env:
            - { name: RUNTIME_IDS_XGB_DIR, value: "/app/xgb" }
            - { name: RUNTIME_IDS_XGB_MODEL, value: "/app/xgb/classifier.json" }
            - { name: RUNTIME_IDS_HYSTERESIS_K, value: "2" }
            - { name: HOME, value: "/tmp" }
          securityContext:          # container-level: hardening
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: xgb, mountPath: /app/xgb, readOnly: true }
            - { name: tmp, mountPath: /tmp }     # scriere efemera (readOnlyRootFS)
      volumes:
        - name: xgb
          configMap: { name: audit-xgb-code }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ids-service-xgb
  namespace: runtime-ids
  labels: { app: ids-audit-xgb }
spec:
  selector: { app: ids-audit-xgb }
  ports:
    - { port: 8080, targetPort: 8080, name: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ids-audit-xgb-pdb
  namespace: runtime-ids
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ids-audit-xgb }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ids-audit-xgb-netpol
  namespace: runtime-ids
spec:
  podSelector:
    matchLabels: { app: ids-audit-xgb }
  policyTypes: [Ingress]
  ingress:
    - from:                            # same as the canonical manifest: correlator and Prometheus only
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: runtime-ids }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 8080 }
