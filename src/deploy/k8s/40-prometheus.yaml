# RBAC for `role: pod` service discovery: Prometheus needs to list and watch pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pod-discovery
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pod-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alert_rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]
    scrape_configs:
      # Scraping per pod, not through the Service. The detector runs two replicas, and a ClusterIP
      # would land on a different one each scrape: the counter would jump between two values, PromQL
      # would read that as a reset, and increase() and rate() would return nonsense. One target per
      # pod keeps each series monotonic and sum() aggregates them correctly.
      - job_name: ids-audit-xgb
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [runtime-ids] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ids-audit-xgb
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: ids-flow
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [runtime-ids] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ids-flow
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9092"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      # Falco is not scraped here: the engine captures nothing on the AKS node kernel.
  alert_rules.yml: |
    groups:
      - name: ids-alerts
        rules:
          - alert: IDSAttackDetected
            expr: increase(runtime_ids_alerts_total{severity=~"CRITICAL|HIGH"}[1m]) > 0
            for: 0s
            labels: { severity: critical, component: audit }
            annotations:
              summary: "Kubernetes API attack detected (audit component)"
              description: "The audit component raised CRITICAL or HIGH alerts in the last minute."
          - alert: AuditXGBAttackDetected
            expr: increase(audit_xgb_alerts_total[1m]) > 0
            for: 0s
            labels: { severity: critical, component: audit-xgb }
            annotations:
              summary: "Kubernetes API attack detected (XGBoost detector)"
              description: "The XGBoost detector flagged audit windows in the last minute."
          - alert: FlowAttackDetected
            expr: increase(runtime_ids_flow_alerts_total[1m]) > 0
            for: 0s
            labels: { severity: warning, component: flow }
            annotations:
              summary: "Malicious network traffic detected (flow component)"
              description: "The flow component raised alerts on network traffic in the last minute."
          - alert: FalcoRuntimeDetected
            # falco_alerts_total is labelled per pod and rule, so every new detection creates a new
            # series - and increase()[1m] never sees the absent->1 transition on a series that did
            # not exist a minute ago. Summing first and comparing against the offset value does.
            expr: sum(falco_alerts_total{priority=~"Warning|Error|Critical|Alert|Emergency"}) - (sum(falco_alerts_total{priority=~"Warning|Error|Critical|Alert|Emergency"} offset 1m) or vector(0)) > 0
            for: 0s
            labels: { severity: warning, component: falco }
            annotations:
              summary: "Suspicious container runtime activity (Falco)"
              description: "Falco raised runtime alerts (shell or sensitive file access) in the last minute."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - { containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - { port: 9090, targetPort: 9090 }
