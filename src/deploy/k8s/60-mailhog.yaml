# MailHog: a throwaway SMTP server with a web inbox, so alert email can be demonstrated end to end.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: monitoring
  labels: { app: mailhog }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailhog }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 1025, name: smtp }
            - { containerPort: 8025, name: ui }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: monitoring
  labels: { app: mailhog }
spec:
  selector: { app: mailhog }
  ports:
    - { port: 1025, targetPort: 1025, name: smtp }
    - { port: 8025, targetPort: 8025, name: ui }
