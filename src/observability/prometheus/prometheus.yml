global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # audit detector, on the host
  - job_name: "ids-service"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # audit streamer, if it is running
  - job_name: "ids-streamer"
    static_configs:
      - targets: ["host.docker.internal:9091"]

  # flow exporter, if it is running
  - job_name: "ids-flow"
    static_configs:
      - targets: ["host.docker.internal:9092"]
