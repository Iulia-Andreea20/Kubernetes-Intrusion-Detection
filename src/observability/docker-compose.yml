# Local observability stack, for running the IDS outside a cluster.
#   Prometheus    scrapes the service and the streamer, evaluates the alert rules
#   Alertmanager  routes alerts to email
#   MailHog       a throwaway SMTP server with a web inbox, so no real credentials are needed
#   Grafana       the dashboards
#
# The IDS itself runs on the host (:8080 and :9091); the containers reach it through
# host.docker.internal.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ids-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ids-alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ids-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # inbox web UI

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ids-grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
