# Adapter AUDIT pentru AKS — ÎNLOCUIEȘTE streamer-ul file-based din kind.
# Pe AKS audit log-ul API-server-ului NU e un fișier pe nod (control-plane e managed);
# merge în Azure Monitor / Log Analytics. Acest pod citește kube-audit din Log Analytics
# (KQL poll) și hrănește serviciul Audit, exact ca streamer-ul pe kind.
#
# Config (creat de deploy_aks.sh, NU comis în git):
#   ConfigMap ids-azure-config  -> LA_WORKSPACE_ID (GUID-ul workspace-ului)
#   Secret    ids-azure-sp      -> AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ids-audit-adapter
  namespace: runtime-ids
  labels: { app: ids-audit-adapter, component: audit }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ids-audit-adapter }
  template:
    metadata:
      labels: { app: ids-audit-adapter, component: audit }
    spec:
      containers:
        - name: adapter
          image: andreeagrigore/ids-audit-adapter:2.3
          imagePullPolicy: Always
          env:
            - { name: RUNTIME_IDS_SERVICE_URL, value: "http://ids-service-xgb:8080" }
            - { name: POLL_INTERVAL,  value: "15" }
            - { name: LOOKBACK_MIN,   value: "10" }
            - name: LA_WORKSPACE_ID
              valueFrom:
                configMapKeyRef: { name: ids-azure-config, key: LA_WORKSPACE_ID }
            # SP OPȚIONAL (optional: true): dacă secretul lipsește, DefaultAzureCredential cade pe
            # MANAGED IDENTITY (identitatea kubelet a AKS via IMDS) — recomandat, fără secret de gestionat.
            # Necesită: rol „Log Analytics Reader" pe workspace pt identitatea kubelet (vezi setup_aks.sh / README).
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef: { name: ids-azure-sp, key: AZURE_TENANT_ID, optional: true }
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: ids-azure-sp, key: AZURE_CLIENT_ID, optional: true }
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: ids-azure-sp, key: AZURE_CLIENT_SECRET, optional: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
